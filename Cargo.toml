[package]
name = "cabin"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
arboard = "3"
chrono = { version = "0.4", features = ["clock"] }
crossterm = "0.29"
directories-next = "2"
ignore = "0.4"
image = "0.25"
ratatui = "0.29"
ratatui-image = { version = "8.1.1", default-features = false, features = ["image-defaults", "crossterm"] }
trash = "5"
