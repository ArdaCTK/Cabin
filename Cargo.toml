[package]
name = "cabin"
version = "0.1.0"
edition = "2021"
default-run = "cabin"

[[bin]]
name = "cabin"
path = "src/main.rs"

[[bin]]
name = "cab"
path = "src/bin/cab.rs"

[dependencies]
anyhow = "1"
arboard = "3"
chrono = { version = "0.4", features = ["clock"] }
crossterm = "0.29"
directories-next = "2"
ignore = "0.4"
image = "0.25"
lofty = "0.24"
lopdf = "0.34"
serde = { version = "1", features = ["derive"] }
ratatui = "0.29"
ratatui-image = { version = "8.1.1", default-features = false, features = ["image-defaults", "crossterm"] }
remeta = { version = "1.2", features = ["videos"] }
sysinfo = "0.30.13"
toml = "0.8"
trash = "5"
